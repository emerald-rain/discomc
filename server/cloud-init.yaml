#cloud-config
# First boot of the Minecraft server. The Worker sends this as Hetzner user_data
# and fills the two base64 placeholders below: /etc/mc.env (R2 credentials, backup key,
# Worker URL) and docker-compose.yml.

packages: [docker.io, docker-cli, docker-compose, zstd, rclone, btop, micro]

# --- User and SSH: key-only login as malysh (uid 1000, same as itzg) ---------

users:
  - name: malysh
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL:ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFV3k2PXPkmuK0d1rBJSbeHNQjeSnOwWAYYfEjgRJVTN malysh-laptop

ssh_pwauth: false
disable_root: true

swap:
  filename: /swapfile
  size: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf # "10-": sshd uses the first value it finds
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers malysh

  - path: /etc/sysctl.d/99-swappiness.conf
    content: vm.swappiness=10

  - path: /etc/mc.env
    permissions: "0600"
    encoding: b64
    content: __MC_ENV__

  # Tell the Worker about a state change: write state/vm in R2, then ask it to redraw the panel.
  - path: /usr/local/bin/mc-report
    permissions: "0755"
    content: |
      #!/bin/bash
      set -a; . /etc/mc.env; set +a
      printf %s "$1" | rclone rcat r2:mc-world/state/vm || true
      curl -fsS -m 10 -X POST "$WORKER/refresh" || true

  # Restore the world and mod configs from R2, start Minecraft, report to the Worker.
  - path: /usr/local/bin/mc-start
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      set -a; . /etc/mc.env; set +a
      trap 'mc-report "error: start failed at line $LINENO (journalctl -u cloud-final)"' ERR

      cd /srv/mc
      mkdir -p data config
      rclone copy r2:mc-world/config config # mod configs
      [ -z "$BACKUP" ] || rclone cat "r2:mc-world/$BACKUP" | zstd -d | tar -x -C data
      rm -f data/world/session.lock
      chown -R 1000:1000 .
      touch .restored # mc-backup only runs after a complete restore
      docker compose up -d

      for _ in $(seq 180); do # 15 min
        [ "$(docker inspect -f '{{.State.Health.Status}}' mc-server)" = healthy ] && { mc-report online; exit 0; }
        sleep 5
      done
      mc-report "error: Minecraft not healthy 15 min after start (docker logs mc-server)"
      exit 1

  # Stop Minecraft and upload the world to R2. Run by mc-backup.service on every shutdown.
  - path: /usr/local/bin/mc-backup
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      set -a; . /etc/mc.env; set +a
      cd /srv/mc
      [ -f .restored ] || { echo "world was never restored, skipping backup"; exit 0; }
      mc-report saving
      docker compose stop
      key="backups/$(date -u +%FT%TZ).tar.zst"
      tar -C data --exclude=world/session.lock -c world | zstd -T0 | rclone rcat "r2:mc-world/$key"
      echo "uploaded $key"
      mc-report saved

  # Does nothing on boot; on shutdown runs mc-backup while docker and network are still up
  # (units stop in reverse order). Hetzner's ACPI shutdown waits for it.
  - path: /etc/systemd/system/mc-backup.service
    content: |
      [Unit]
      Description=Back up the Minecraft world to R2 on shutdown
      Wants=network-online.target
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true
      ExecStop=/usr/local/bin/mc-backup
      TimeoutStopSec=30min

      [Install]
      WantedBy=multi-user.target

  # Power off after 10 min without players, only at minutes 50-53 of the paid Hetzner hour
  # (counted from boot), so backup + delete finish before the next hour is billed.
  # An unreachable server counts as active.
  - path: /usr/local/bin/mc-idle
    permissions: "0755"
    content: |
      #!/bin/bash
      last=/run/mc-last-active # tmpfs: reset on boot, so 10 min grace after start
      online=$(docker exec mc-server mc-monitor status 2>/dev/null | grep -o 'online=[0-9]*' | cut -d= -f2)
      if [ "${online:-x}" != 0 ] || [ ! -e "$last" ]; then touch "$last"; exit 0; fi

      idle=$(( $(date +%s) - $(stat -c %Y "$last") ))
      minute=$(( $(cut -d. -f1 /proc/uptime) / 60 % 60 ))
      if [ "$idle" -ge 600 ] && [ "$minute" -ge 50 ] && [ "$minute" -le 53 ]; then
        echo "no players for $((idle / 60)) min, minute $minute of the hour: powering off"
        systemctl poweroff
      fi

  - path: /etc/systemd/system/mc-idle.service
    content: |
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/mc-idle

  - path: /etc/systemd/system/mc-idle.timer
    content: |
      [Timer]
      OnCalendar=minutely

      [Install]
      WantedBy=timers.target

  - path: /srv/mc/docker-compose.yml # server/docker-compose.yml
    encoding: b64
    content: __COMPOSE__

runcmd:
  - [systemctl, reload, ssh]
  - [sysctl, --system]
  - [systemctl, enable, --now, mc-backup, mc-idle.timer]
  - [/usr/local/bin/mc-start]
