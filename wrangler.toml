name = "discomc"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Not secrets. Also read by scripts/*.mjs (process.env overrides).
[vars]
DISCORD_PUBLIC_KEY = "b566aa0b8991891c94c21d5d2fe1fce6e2dabc5cedbe6c19cdf4e95f607a777f"
DISCORD_APP_ID = "1442874755932884992"
DISCORD_GUILD_ID = "1058005724199923763"
CF_ZONE_ID = "4f4aafee57eea83021328ba6eeb9241d"
R2_ACCOUNT_ID = "a48fd80d5d5a24bcf34c2d4d7f4cd806"

# Workers Logs (dashboard -> Logs)
[observability]
enabled = true

# Deletes powered-off servers and redraws the panel (see scheduled() in src/index.js)
[triggers]
crons = ["* * * * *"]

# server/*.yaml|yml are imported by the Worker as strings
[[rules]]
type = "Text"
globs = ["**/*.yaml", "**/*.yml"]
fallthrough = true

[[r2_buckets]]
binding = "WORLD"
bucket_name = "mc-world"

# Worker secrets (Settings -> Variables and Secrets, type Secret):
#   HETZNER_TOKEN, CF_DNS_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, DISCORD_BOT_TOKEN
# Optional worker var: HETZNER_SSH_KEY (name of an SSH key in Hetzner)
# Build secret (Settings -> Build -> Variables): DISCORD_BOT_TOKEN (same value)
